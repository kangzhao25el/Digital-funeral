  }

  #ecg-stage {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;

    transition: opacity 2s ease;

    width: min(600px, 90vw);
    height: 120px;
  }

    margin-top: 40px;

    color: #fff;
    font-size: 22px;
    font-weight: 200;
    letter-spacing: 6px;
  }
  #ecg-stage.hidden { opacity: 0; pointer-events: none; }

  #phone-stage {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease;

    position: relative;
    width: min(320px, 78vw);

    border-radius: 44px;
    border: 2px solid #2a2a2a;
    box-shadow: 0 0 0 1px #111, inset 0 0 0 1px #1a1a1a, 0 30px 80px rgba(0,0,0,0.9);
    overflow: hidden;
    aspect-ratio: 9 / 19.5;
  }

  #notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 92px; height: 22px;
    background: #000;
    border-radius: 14px;
    z-index: 30;
  }

  #status-bar {

    display: flex; gap: 4px; align-items: center;
    font-size: 10px;
  }

  #screen {
    position: absolute;
    inset: 0;
    background: #000;
    overflow: hidden;
    border-radius: 42px;
  }

  #home-bar {
    position: absolute;
    bottom: 7px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 4px;

    border-radius: 2px;
    z-index: 30;

    background: #111;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.6s ease;

    width: 100%; height: 100%;

    display: block;

/* ═══════════════════════════════════════════════════════════════════
   AUDIO
   ═══════════════════════════════════════════════════════════════════ */
let audioCtx = null;
let vitality = 0.35;
let heartbeatTimer = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function startHeartbeat() {
  if (heartbeatTimer) return;
  function beat() {
    if (vitality <= 0 || !audioCtx) return;
    const now = audioCtx.currentTime;
    // First tap (louder, with deeper resonance)
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type = 'sine'; o1.frequency.value = 55;
    g1.gain.setValueAtTime(1.10 * vitality, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.start(now); o1.stop(now + 0.14);
    // Second tap (lub-dub)
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = 48;
    g2.gain.setValueAtTime(0.84 * vitality, now + 0.18);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(now + 0.18); o2.stop(now + 0.32);

    const period = 900 + (1 - vitality) * 1200;
    vitality = Math.max(0.18, vitality - 0.0012);
    heartbeatTimer = setTimeout(beat, period);
  }
  beat();
}

function stopHeartbeat() {
  if (heartbeatTimer) clearTimeout(heartbeatTimer);
  heartbeatTimer = null;
}

function playGlitchHum(intensity = 1) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = 0.5;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 220;
  o.type = 'sawtooth'; o.frequency.value = 55;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.07 * intensity, now + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now + dur);
}

function playErrorBeep(intensity = 1) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = 1100;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.05 * intensity, now + 0.005);
  g.gain.setValueAtTime(0.05 * intensity, now + 0.06);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now + 0.12);
}

function playShutdown() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = 1.5;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 400;
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(200, now);
  o.frequency.exponentialRampToValueAtTime(30, now + dur);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.15, now + 0.1);
  g.gain.setValueAtTime(0.15, now + dur - 0.3);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now + dur + 0.1);
}

function playFlatlineBeep() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = 5.0;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.13, now + 0.05);
  g.gain.setValueAtTime(0.13, now + dur - 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now + dur + 0.1);
}

/* ═══════════════════════════════════════════════════════════════════
   STAGE 1: ECG OPENING
   ═══════════════════════════════════════════════════════════════════ */
function runECG() {
  const cv = document.getElementById('ecg-canvas');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  let x = 0;
  let alpha = 0.35;
  let raf;

  function tick() {
    if (x >= W) {
      x = 0;
      ctx.clearRect(0, 0, W, H);
    }
    ctx.strokeStyle = `rgba(220, 60, 50, ${alpha})`;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';

    let y = H / 2;
    const cycle = x % 110;
    if (alpha > 0.05) {
      if (cycle > 12 && cycle < 22) y -= 4 * alpha;
      if (cycle >= 22 && cycle < 24) y += 6 * alpha;
      if (cycle >= 24 && cycle < 28) y -= 38 * alpha;
      if (cycle >= 28 && cycle < 32) y += 14 * alpha;
      if (cycle > 42 && cycle < 56) y -= 7 * alpha;
    }

    ctx.beginPath();
    ctx.moveTo(x, H / 2);
    ctx.lineTo(x + 2, y);
    ctx.stroke();

    x += 2;
    alpha = Math.max(0.18, alpha - 0.00015);
    raf = requestAnimationFrame(tick);
  }
  tick();
  return () => cancelAnimationFrame(raf);
}

/* ═══════════════════════════════════════════════════════════════════
   STAGE 2: ALBUM GRID
   ═══════════════════════════════════════════════════════════════════ */
function buildAlbumGrid() {
  const grid = document.getElementById('thumb-grid');
  grid.innerHTML = '';

  // First, the 10 playback cards' thumbnails
  CARDS.forEach((card, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    if (card.type === 'img') {
      const img = document.createElement('img');
      img.src = card.src;
      img.alt = card.label;
      div.appendChild(img);
    } else if (card.type === 'claude') {
      // Mini Claude Chats preview
      div.classList.add('claude-mini');
      div.innerHTML = `
        <div class="mini-title">Chats</div>
        <div class="mini-search">Search</div>
        <div class="mini-item">Spain itinerary<div class="mini-time">Today</div></div>
        <div class="mini-item">Resume editing<div class="mini-time">Today</div></div>
        <div class="mini-item">Reply email<div class="mini-time">Today</div></div>
        <div class="mini-item">Cannes 2026<div class="mini-time">2 days ago</div></div>
      `;
    }
    grid.appendChild(div);
  });

  // Then the 6 extra thumbnails
  EXTRA_THUMBS.forEach(src => {
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    div.appendChild(img);
    grid.appendChild(div);
  });
}

function revealAlbumGrid(stagger = 130) {
  const thumbs = document.querySelectorAll('.thumb');
  thumbs.forEach((t, i) => {
    setTimeout(() => t.classList.add('show'), i * stagger);
  });
  return thumbs.length * stagger;
}

/* ═══════════════════════════════════════════════════════════════════
   STAGE 3: SINGLE VIEWER
   ═══════════════════════════════════════════════════════════════════ */
function buildSingleViewer() {
  const viewer = document.getElementById('single-viewer');
  viewer.innerHTML = '';

  CARDS.forEach(card => {
    const el = document.createElement('div');
    el.className = 'card';
    el.id = card.id;

    if (card.type === 'img') {
      const img = document.createElement('img');
      img.src = card.src;
      img.alt = card.label;
      el.appendChild(img);
    } else if (card.type === 'claude') {
      el.innerHTML = `
        <div class="claude-chats">
          <div class="chats-top">
            <span class="chats-menu">☰</span>
            <span class="chats-title">Chats</span>
            <span class="chats-back">‹</span>
          </div>
          <div class="chats-search">
            <span>🔍</span><span>Search</span>
          </div>
          <div class="chats-list">
            ${CLAUDE_CHAT_HISTORY.map(([title, time]) => `
              <div class="chat-row">
                <div class="ct">
                  <div class="ctitle">${title}</div>
                  <div class="ctime">${time}</div>
                </div>
                <span class="carrow">›</span>
              </div>
            `).join('')}
          </div>
          <div class="fab">+</div>
        </div>
      `;
    }
    viewer.appendChild(el);
  });
}

function playSingleCards(onDone) {
  const viewer = document.getElementById('single-viewer');
  viewer.classList.add('active');
  document.getElementById('album-view').style.display = 'none';

  let i = 0;
  let prev = null;

  function next() {
    if (i >= CARDS.length) {
      onDone && onDone();
      return;
    }
    const card = document.getElementById(CARDS[i].id);
    if (prev) {
      prev.classList.add('exit');
      prev.classList.remove('active');
    }
    card.classList.add('active');
    prev = card;
    i++;
    setTimeout(next, 2800);
  }
  next();
}

/* ═══════════════════════════════════════════════════════════════════
   STAGE 4: FORMAT + DISSOLVE
   ═══════════════════════════════════════════════════════════════════ */
function runFormatProgress(onDone) {
  const screen = document.getElementById('format-screen');
  const fill = document.getElementById('format-fill');
  const pct = document.getElementById('format-percent');
  const fn = document.getElementById('format-filename');

  // Hide all cards first
  document.querySelectorAll('.card').forEach(c => {
    c.classList.remove('active', 'exit');
  });

  screen.classList.add('active');

  const filenames = [
    'photos_index.db', 'cache_001.tmp', 'messages.db',
    'app_history.json', 'media_thumbs.dat', 'sync.lock',
  ];

  let p = 0;
  const step = 2.5;
  const intervalMs = 40;
  let fnIdx = 0;

  const timer = setInterval(() => {
    p += step;
    if (p > 100) p = 100;
    fill.style.width = p + '%';
    pct.textContent = Math.floor(p) + '%';
    if (Math.floor(p / 17) !== fnIdx && fnIdx < filenames.length) {
      fn.textContent = filenames[fnIdx];
      fnIdx++;
    }
    if (p >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        screen.classList.remove('active');
        onDone && onDone();
      }, 700);
    }
  }, intervalMs);
}

function dissolveCard(idx, onDone) {
  const card = document.getElementById(CARDS[idx].id);
  card.classList.add('active');

  const cv = document.getElementById('dissolve-canvas');
  cv.classList.add('active');
  const dc = cv.getContext('2d');

  // Wait one frame for card to be visible
  setTimeout(() => {
    const screen = document.getElementById('screen');
    const W = screen.clientWidth;
    const H = screen.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    dc.scale(dpr, dpr);

    // Strong contrast in speed: card 1 = 1.5x, card 10 = 0.06x (25x difference)
    const speedTable = [1.5, 1.3, 1.0, 0.7, 0.45, 0.28, 0.18, 0.12, 0.08, 0.06];
    const speedFactor = speedTable[idx];

    const TOTAL = Math.floor(360 * speedFactor);
    const NOISE_IN = Math.floor(40 * speedFactor);
    const META_APPEAR = Math.floor(60 * speedFactor);
    const META_FULL = Math.floor(110 * speedFactor);
    const STATUS_BLINK = Math.floor(240 * speedFactor);

    const noiseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>[]{}_-+#@/.:';
    const lines = METADATA[idx];

    let humPlayed = false;
    let errorPlayed = false;
    let frame = 0;

    // Show the original image for a moment before dissolving
    // Image fades out slowly while noise+metadata builds on top
    const imageDwellMs = 4800 * speedFactor; // doubled — let the photo really register
    const fadeOutMs = (META_FULL / 60) * 1000; // fade matches metadata reveal pace

    setTimeout(() => {
      card.style.transition = `opacity ${fadeOutMs}ms ease-in`;
      card.style.opacity = '0';
    }, imageDwellMs);

    function tick() {
      // Background fade — gentler, lets image show through early frames
      const bgAlpha = Math.min(0.7, Math.max(0, (frame - NOISE_IN * 0.5) / NOISE_IN * 0.6));
      dc.fillStyle = `rgba(0, 0, 0, ${bgAlpha})`;
      dc.fillRect(0, 0, W, H);

      // Random green noise — builds in over image
      const density = Math.min(1, frame / NOISE_IN);
      const noiseAlpha = frame > META_FULL ? Math.max(0.2, 1 - (frame - META_FULL) / 60) : Math.min(1, frame / (NOISE_IN * 0.7));
      dc.font = "10px 'Courier New', monospace";
      for (let y = 10; y < H; y += 14) {
        for (let x = 4; x < W; x += 9) {
          if (Math.random() < 0.08 * density) {
            const ch = noiseChars[Math.floor(Math.random() * noiseChars.length)];
            const b = 80 + Math.floor(Math.random() * 160);
            dc.fillStyle = `rgba(40, ${b}, 60, ${noiseAlpha})`;
            dc.fillText(ch, x, y);
          }
        }
      }

      // Trigger glitch hum once on meta appear
      if (frame >= META_APPEAR && !humPlayed) {
        humPlayed = true;
        playGlitchHum(0.6 + idx * 0.1);
      }

      // Metadata lines
      if (frame >= META_APPEAR) {
        const progress = Math.min(1, (frame - META_APPEAR) / (META_FULL - META_APPEAR));
        const linesToShow = Math.floor(progress * lines.length);
        const lineH = 16;
        const startY = (H - lines.length * lineH) / 2;

        for (let li = 0; li <= linesToShow && li < lines.length; li++) {
          const line = lines[li];
          const isStatus = line.includes('STATUS');
          const y = startY + li * lineH;

          // Solid black background bar for this line
          dc.fillStyle = 'rgba(0, 0, 0, 0.75)';
          dc.fillRect(0, y - 11, W, 14);

          let color = '#5acc5a';
          if (isStatus) {
            if (frame >= STATUS_BLINK) {
              if (!errorPlayed) {
                errorPlayed = true;
                playErrorBeep(0.7 + idx * 0.06);
              }
              const phase = Math.floor((frame - STATUS_BLINK) / 5) % 2;
              color = phase === 0 ? '#e85050' : '#5a1a1a';
            } else {
              color = '#c0392b';
            }
          }

          dc.fillStyle = color;
          dc.font = `${isStatus ? 'bold ' : ''}11px 'Courier New', monospace`;
          dc.fillText(line, 14, y);
        }
      }

      frame++;
      if (frame < TOTAL) {
        requestAnimationFrame(tick);
      } else {
        // Final fade-out of the canvas
        let alpha = 0;
        const fadeOut = setInterval(() => {
          alpha += 0.06;
          dc.fillStyle = `rgba(0, 0, 0, ${alpha})`;
          dc.fillRect(0, 0, W, H);
          if (alpha >= 1) {
            clearInterval(fadeOut);
            dc.clearRect(0, 0, W, H);
            card.style.opacity = '';
            card.style.transition = '';
            card.classList.remove('active');
            cv.classList.remove('active');
            onDone && onDone();
          }
        }, 24);
      }
    }

    requestAnimationFrame(tick);
  }, 50);
}

function runDissolveLoop(onDone) {
  let i = 0;
  function next() {
    if (i >= CARDS.length) {
      playShutdown();
      onDone && onDone();
      return;
    }
    dissolveCard(i, () => {
      i++;
      setTimeout(next, 250);
    });
  }
  next();
}

/* ═══════════════════════════════════════════════════════════════════
   STAGE 5: ALBUM ZERO + FLATLINE
   ═══════════════════════════════════════════════════════════════════ */
function showAlbumZero(onDone) {
  const viewer = document.getElementById('single-viewer');
  viewer.classList.remove('active');

  const album = document.getElementById('album-view');
  album.style.display = '';
  album.style.opacity = '0';

  // Clear grid, update sub
  document.getElementById('thumb-grid').innerHTML = '';
  document.getElementById('album-sub').textContent = '0 photos, 0 videos';

  // Fade in
  setTimeout(() => {
    album.style.transition = 'opacity 1s ease';
    album.style.opacity = '1';
  }, 100);

  // Dwell 5 seconds, then fade out everything
  setTimeout(() => {
    document.getElementById('phone-stage').style.transition = 'opacity 1.5s ease';
    document.getElementById('phone-stage').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('phone-stage').style.display = 'none';
      onDone && onDone();
    }, 1500);
  }, 5000);
}

function runFlatline() {
  stopHeartbeat();
  playFlatlineBeep();

  const stage = document.getElementById('flatline-stage');
  stage.classList.add('visible');

  const cv = document.getElementById('flatline-canvas');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.strokeStyle = 'rgba(220, 60, 50, 0.6)';
  ctx.lineWidth = 1.5;

  let x = 0;
  function draw() {
    ctx.beginPath();
    ctx.moveTo(x, H / 2);
    x += 2;
    ctx.lineTo(x, H / 2);
    ctx.stroke();
    if (x < W) requestAnimationFrame(draw);
  }
  draw();
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN ORCHESTRATION
   ═══════════════════════════════════════════════════════════════════ */
async function startNarrative() {
  initAudio();
  document.getElementById('start-overlay').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('start-overlay').remove();
  }, 1500);

  // Build content
  buildAlbumGrid();
  buildSingleViewer();

  // Stage 1: ECG
  runECG();
  startHeartbeat();

  // Title fades in at 1.5s
  setTimeout(() => {
    document.getElementById('main-title').style.opacity = '1';
  }, 1500);

  // After 7s, fade out ECG, show phone
  await wait(7000);
  document.getElementById('ecg-stage').classList.add('hidden');

  await wait(2000);
  document.getElementById('ecg-stage').style.display = 'none';
  document.getElementById('phone-stage').classList.add('visible');

  // Stage 2: Album grid reveal
  await wait(800);
  const revealDuration = revealAlbumGrid(130);
  // After all thumbs appear, dwell 3.5 seconds, then enter single viewer
  await wait(revealDuration + 3500);

  // Stage 3: Single playback
  await new Promise(resolve => {
    playSingleCards(resolve);
  });

  // Stage 4a: Format progress
  await new Promise(resolve => {
    runFormatProgress(resolve);
  });

  // Stage 4b: Dissolve loop
  await new Promise(resolve => {
    runDissolveLoop(resolve);
  });

  // Stage 5: Album zero + flatline
  await new Promise(resolve => {
    showAlbumZero(resolve);
  });

  runFlatline();
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

document.getElementById('start-button').addEventListener('click', () => {
  startNarrative();
});
</script>
