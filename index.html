<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Digital Funeral for a Girl</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-dim: #555555;
            --accent-red: #ff3b30;
            --accent-green: #00ff41;
            --ui-gray: #1c1c1e;
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: crosshair;
        }

        /* --- 覆盖层 --- */
        #interaction-trigger {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 2s ease;
        }
        #trigger-btn {
            background: none;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 15px 30px;
            font-family: var(--font-mono);
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #trigger-btn:hover { border-color: white; color: white; }

        /* --- 第一幕：心电图 --- */
        #ecg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease;
        }
        #ecg-canvas { width: 800px; height: 200px; filter: drop-shadow(0 0 5px var(--accent-red)); }
        .title-container {
            text-align: center;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 3s ease;
        }
        .title-container h1 { font-weight: 200; font-size: 1.8rem; letter-spacing: 12px; margin-bottom: 10px; }
        .title-container p { font-family: var(--font-mono); color: var(--text-dim); font-size: 0.75rem; letter-spacing: 2px; }

        /* --- 第二幕：手机外框 --- */
        #phone-container {
            position: relative;
            width: 320px;
            height: 692px;
            background: #000;
            border: 10px solid #1a1a1a;
            border-radius: 45px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: opacity 1.5s ease;
        }

        .status-bar {
            height: 44px;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            z-index: 10;
        }
        .dynamic-island {
            width: 100px;
            height: 25px;
            background: #000;
            border-radius: 20px;
            position: absolute;
            left: 50%;
            top: 11px;
            transform: translateX(-50%);
        }

        #album-view {
            flex: 1;
            padding: 20px 5px;
            display: block;
        }
        .album-title { font-size: 26px; font-weight: 700; margin: 15px 10px 5px; }
        .album-subtitle { color: var(--text-dim); font-size: 13px; margin: 0 10px 25px; }
        
        /* 网格布局修正 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }
        .thumb-box {
            aspect-ratio: 1 / 1;
            background: #111;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 单张内容查看 */
        #content-view {
            position: absolute;
            inset: 44px 0 0 0;
            background: #000;
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            z-index: 20;
        }
        .main-img-display {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            margin-top: 10px;
        }
        .mockup-card {
            flex: 1;
            background: #000;
            padding: 15px;
            font-size: 13px;
            line-height: 1.5;
        }
        .mockup-label { font-family: var(--font-mono); color: var(--accent-green); font-size: 9px; margin-bottom: 8px; display: block; }
        .mockup-meta { color: var(--text-dim); font-size: 10px; margin-bottom: 12px; font-family: var(--font-mono); }

        /* --- 格式化层 --- */
        #format-layer {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,1);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .progress-bar { width: 100%; height: 2px; background: #222; margin: 20px 0; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent-red); }
        #file-name { font-family: var(--font-mono); font-size: 9px; color: var(--accent-red); margin-top: 10px; }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 110;
        }

        .home-indicator {
            width: 120px;
            height: 5px;
            background: #333;
            border-radius: 10px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
        }

        .fade-out { opacity: 0 !important; }
        .fade-in { opacity: 1 !important; }
    </style>
</head>
<body>

    <div id="interaction-trigger">
        <button id="trigger-btn">[ INITIATE SYSTEM ]</button>
    </div>

    <div id="ecg-layer">
        <canvas id="ecg-canvas"></canvas>
        <div class="title-container" id="titles">
            <h1>A Digital Funeral for a Girl</h1>
            <p>Digital Remains · 2026</p>
        </div>
    </div>

    <div id="phone-container">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>9:41</span>
            <span style="letter-spacing: 1px;">📶 WiFi 🔋</span>
        </div>

        <div id="album-view">
            <h1 class="album-title">所有照片</h1>
            <p class="album-subtitle" id="total-count">247 张照片和视频</p>
            <div class="photo-grid" id="grid-container"></div>
        </div>

        <div id="content-view">
            <img id="display-img" class="main-img-display" src="" alt="">
            <div id="slide-content" class="mockup-card"></div>
        </div>

        <div id="format-layer">
            <div style="font-family: var(--font-mono); font-size: 14px; letter-spacing: 4px;">FORMATTING</div>
            <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
            <div id="file-name"></div>
        </div>

        <canvas id="matrix-canvas"></canvas>
        <div class="home-indicator"></div>
    </div>

<script>
/** 映射你上传的图片文件 **/
const DATA_REMAINS = [
    { img: 'chatgpt.jpg', type: 'AI_CLAUDE_JSON', title: '巴塞罗那行程规划', meta: 'model: claude-3-opus | tokens: 842', content: 'Q: 帮我规划巴塞罗那5天行程。\\nAI: 建议首日访问圣家堂。作为高迪的杰作，它融合了自然与神性的代码。' },
    { img: 'extra-5-cafe.jpg', type: 'JPG_IMAGE', title: '独处时刻', meta: 'ISO 400 | f/2.0 | 下午 3:14', content: '咖啡馆里的人很多，但我只听得见自己打字的声音。' },
    { img: 'extra-1-breakfast.jpg', type: 'JPG_IMAGE', title: '最后的早餐记录', meta: 'ISO 100 | f/1.8 | 阳光充足', content: '尝试复刻了那家店的欧姆蛋。看起来很完美，但我并没有胃口。' },
    { img: 'extra-3-poster.jpg', type: 'PNG_IMAGE', title: '展览海报', meta: 'source: saved_images | status: pending', content: '原本打算去看的艺术展。现在它只是相册里一个不会被兑现的标记。' },
    { img: 'extra-4-shard.jpg', type: 'HEIC_IMAGE', title: '圣家堂外墙碎片', meta: 'GPS: 41.4036° N, 2.1744° E', content: '细节里的上帝。我以为在记录世界，其实只是在生产数据。' },
    { img: 'extra-2-dessert.jpg', type: 'JPG_IMAGE', title: '一人份甜品', meta: 'search: how_to_feel_better', content: '糖分是临时的止疼药。数据是永恒的止疼药。' },
    { img: 'family.png', type: 'WECHAT_CHAT', title: '相亲相爱一家人', meta: 'sender: Mother | status: unread', content: '妈：看到你发的照片了。记得多吃点，别总是一个人。早点睡。' },
    { img: 'facetime.jpg', type: 'JPG_IMAGE', title: 'FaceTime 截图', meta: 'duration: 42:15 | detection: forced_smile', content: '他说我气色好多了。我按下了截图键，作为这句谎言的数字存证。' }
];

let audioCtx, ecgLife = 1.0;
const ecgCanvas = document.getElementById('ecg-canvas');
const ecgCtx = ecgCanvas.getContext('2d');

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beat = () => {
        if (ecgLife <= 0.05) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
        gain.gain.setValueAtTime(0.3 * ecgLife, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.15);
        setTimeout(beat, 1200 / ecgLife);
    };
    beat();
}

function drawECG() {
    let x = 0;
    const w = ecgCanvas.width = 800;
    const h = ecgCanvas.height = 200;
    ecgCtx.lineWidth = 2;
    ecgCtx.strokeStyle = '#ff3b30';

    function step() {
        if (x > w) { x = 0; ecgCtx.clearRect(0,0,w,h); }
        ecgCtx.beginPath();
        ecgCtx.moveTo(x, h/2);
        const phase = x % 120;
        let y = h/2;
        if (ecgLife > 0.05) {
            if (phase >= 38 && phase < 43) y -= 60 * ecgLife; 
            else if (phase >= 43 && phase < 48) y += 20 * ecgLife;
        }
        x += 2;
        ecgCtx.lineTo(x, y);
        ecgCtx.stroke();
        requestAnimationFrame(step);
    }
    step();
}

async function runFuneral() {
    document.getElementById('interaction-trigger').style.opacity = '0';
    setTimeout(() => document.getElementById('interaction-trigger').remove(), 2000);

    initAudio();
    drawECG();
    document.getElementById('ecg-layer').style.opacity = '1';
    setTimeout(() => document.getElementById('titles').style.opacity = '1', 1500);

    const decay = setInterval(() => {
        ecgLife -= 0.1;
        if (ecgLife <= 0) { ecgLife = 0; clearInterval(decay); }
    }, 5000);

    await wait(8000);
    document.getElementById('ecg-layer').classList.add('fade-out');
    
    await wait(2000);
    document.getElementById('phone-container').style.opacity = '1';

    const grid = document.getElementById('grid-container');
    DATA_REMAINS.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'thumb-box';
        const img = document.createElement('img');
        img.src = item.img;
        div.appendChild(img);
        grid.appendChild(div);
        setTimeout(() => div.style.opacity = '1', 500 + (i * 100));
    });

    await wait(4000);
    
    const contentView = document.getElementById('content-view');
    const displayImg = document.getElementById('display-img');
    const slideArea = document.getElementById('slide-content');
    
    for(let i=0; i < DATA_REMAINS.length; i++) {
        const item = DATA_REMAINS[i];
        displayImg.src = item.img;
        slideArea.innerHTML = `
            <span class="mockup-label">${item.type}</span>
            <div class="mockup-meta">${item.meta}</div>
            <div style="font-weight:600; margin-bottom:12px; font-size:15px;">${item.title}</div>
            <div style="color:#ccc;">${item.content}</div>
        `;
        contentView.style.transform = 'translateX(0)';
        await wait(3500);
        if (i < DATA_REMAINS.length - 1) {
            contentView.style.transform = 'translateX(100%)';
            await wait(600);
        }
    }

    await runFormatting();
}

async function runFormatting() {
    const formatLayer = document.getElementById('format-layer');
    formatLayer.style.display = 'flex';
    const fill = document.getElementById('p-fill');
    const fileLabel = document.getElementById('file-name');
    
    const files = ['manifest.json', 'user_data_01', 'cache_temp', 'sync_locked', 'final_log', 'deleting...'];
    for(let p=0; p<=100; p++) {
        fill.style.width = p + '%';
        if (p % 20 === 0) fileLabel.innerText = files[p/20];
        await wait(40);
    }
    
    await wait(1000);
    formatLayer.style.opacity = '0';
    await wait(1000);
    formatLayer.style.display = 'none';

    for (let i = 0; i < DATA_REMAINS.length; i++) {
        await dissolve(DATA_REMAINS[i], i+1);
    }

    finish();
}

function dissolve(item, index) {
    return new Promise(resolve => {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 320; canvas.height = 692;
        
        let frame = 0;
        const chars = "X01$#!?";
        const metaText = [
            `DELETING: ${item.img}`,
            `CREATED: 2024-05-10`,
            `STATUS: NULL`,
            `INDEX: ${index}/8`
        ];

        function step() {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.font = '10px Courier New';
            ctx.fillStyle = '#00ff41';

            for(let i=0; i<40; i++) {
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)], Math.random()*canvas.width, Math.random()*canvas.height);
            }

            if (frame > 20) {
                metaText.forEach((t, idx) => ctx.fillText(t, 40, 300 + (idx * 20)));
            }

            if (frame < 70) { frame++; requestAnimationFrame(step); } 
            else { setTimeout(() => { ctx.clearRect(0,0,canvas.width, canvas.height); resolve(); }, 1200); }
        }
        step();
    });
}

function finish() {
    document.getElementById('content-view').style.display = 'none';
    document.getElementById('total-count').innerText = '0 张照片 · 0 个视频';
    document.getElementById('grid-container').innerHTML = '';
    
    setTimeout(() => {
        document.getElementById('phone-container').style.opacity = '0';
        setTimeout(() => {
            ecgLife = 0;
            document.getElementById('ecg-layer').style.opacity = '1';
            setTimeout(() => document.body.style.opacity = '0', 5000);
        }, 2000);
    }, 3000);
}

function wait(ms) { return new Promise(res => setTimeout(res, ms)); }
document.getElementById('trigger-btn').onclick = runFuneral;
</script>
</body>
</html>
